contexts:
  docsenv:
    container:
      name: ensono/eir-asciidoctor:1.2.39
      shell: pwsh
      shell_args:
        - -Command
    env:
      PSModulePath: /eirctl/src/modules
    envfile:
      exclude:
        - path
        - home
        - posh_azure_subscription

  powershell_test:
    container:
      name: ensono/eir-infrastructure:1.2.39
      shell: pwsh
      shell_args:
        - -Command
    env:
      PSModulePath: /eirctl/src/modules
      HOST_UIDGID: $UID:$GID
    envfile:
      exclude:
        - posh_azure_subscription

  powershell:
    container:
      name: ensono/eir-infrastructure:1.2.39
      shell: pwsh
      shell_args:
        - -Command
    envfile:
      exclude:
        - home
        - path
        - posh_azure_subscription

  dotnet:
    container:
      name: ensono/eir-dotnet:1.2.39
      shell: pwsh
      shell_args:
        - -Command
    env:
      HOST_UIDGID: $UID:$GID
    envfile:
      exclude:
        - posh_azure_subscription
